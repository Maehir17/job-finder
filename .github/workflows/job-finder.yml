name: job-finder

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: write             # needed to commit updated state/seen.txt

concurrency:
  group: job-finder           # never run two at once (state would race)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Find jobs and notify
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || 'redacted@example.com' }}
        run: python main.py

      - name: Persist seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.txt
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
